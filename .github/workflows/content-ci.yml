name: Content and installable Skill
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: content-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare development-only image renderer
        run: |
          python -m pip install -r requirements-content.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Test issue permissions and draft PR orchestration
        run: node --test .github/scripts/content-intake.test.cjs
      - name: Test runtime and contribution pipeline
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -q
      - name: Preserve published and retired identities
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:skills/mcd-hidden-explorer/content/catalog.json" 2>/dev/null; then
            git show "$BASE_SHA:skills/mcd-hidden-explorer/content/catalog.json" > "$RUNNER_TEMP/baseline.json"
            python skills/mcd-hidden-explorer/scripts/content_pipeline.py validate --baseline "$RUNNER_TEMP/baseline.json"
          fi
      - name: Validate contribution data and image hashes
        id: content
        run: |
          python skills/mcd-hidden-explorer/scripts/content_pipeline.py validate > "$RUNNER_TEMP/content-result.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/content-result.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("active_count="+str(d["active_count"])+"\n")'
      - name: Build full Skill with reviewed images
        if: steps.content.outputs.active_count != '0'
        run: >-
          python skills/mcd-hidden-explorer/scripts/content_pipeline.py build
          --output "$RUNNER_TEMP/build/mc-master-eater" --zip "$RUNNER_TEMP/mc-master-eater.zip"
      - name: Unzip in a clean directory and exercise installed runtime
        if: steps.content.outputs.active_count != '0'
        run: |
          python -m zipfile -e "$RUNNER_TEMP/mc-master-eater.zip" "$RUNNER_TEMP/clean-install"
          python "$RUNNER_TEMP/clean-install/mc-master-eater/scripts/content_pipeline.py" verify --bundle "$RUNNER_TEMP/clean-install/mc-master-eater"
          python "$RUNNER_TEMP/clean-install/mc-master-eater/scripts/bundle_smoke.py" --bundle "$RUNNER_TEMP/clean-install/mc-master-eater"
      - uses: actions/upload-artifact@v4
        if: steps.content.outputs.active_count != '0'
        with:
          name: mc-master-eater-${{ github.sha }}
          path: ${{ runner.temp }}/mc-master-eater.zip
          if-no-files-found: error
          retention-days: 30
      - name: Explain an empty reviewed catalogue
        if: steps.content.outputs.active_count == '0'
        run: echo '尚无公开复核条目；功能由合成图片的端到端测试验证，不生成空包或冒充现有22张本地卡已获公开授权。' >> "$GITHUB_STEP_SUMMARY"
